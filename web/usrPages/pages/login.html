<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jettyCat Live Studio 登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 18px;
            color: #e5eefc;
            background:
                radial-gradient(circle at top left, rgba(34, 211, 238, 0.22), transparent 26%),
                radial-gradient(circle at right center, rgba(168, 85, 247, 0.18), transparent 28%),
                linear-gradient(160deg, #07111f 0%, #0b1426 48%, #111a2d 100%);
        }

        .shell {
            width: 100%;
            max-width: 1040px;
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            overflow: hidden;
            border-radius: 26px;
            border: 1px solid rgba(148, 163, 184, 0.16);
            background: rgba(7, 17, 31, 0.72);
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(18px);
            animation: rise 0.35s ease-out;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(-24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero {
            padding: 46px;
            border-right: 1px solid rgba(148, 163, 184, 0.12);
            background: linear-gradient(180deg, rgba(14, 26, 45, 0.94), rgba(8, 16, 29, 0.94));
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 28px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            padding: 10px 14px;
            border-radius: 999px;
            width: fit-content;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: #9be7ff;
            font-size: 12px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .hero h1 {
            margin-top: 18px;
            font-size: clamp(32px, 5vw, 48px);
            line-height: 1.08;
            color: #f8fbff;
        }

        .hero p {
            margin-top: 16px;
            max-width: 30rem;
            color: rgba(226, 232, 240, 0.78);
            line-height: 1.75;
            font-size: 15px;
        }

        .signals {
            display: grid;
            gap: 14px;
        }

        .signal {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-radius: 16px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(148, 163, 184, 0.12);
            color: #dbeafe;
        }

        .signal-dot {
            width: 10px;
            height: 10px;
            border-radius: 999px;
            background: linear-gradient(135deg, #22d3ee, #a855f7);
            box-shadow: 0 0 18px rgba(34, 211, 238, 0.55);
            flex-shrink: 0;
        }

        .login {
            padding: 46px 42px;
            background: rgba(7, 17, 31, 0.58);
        }

        .login-head {
            margin-bottom: 24px;
        }

        .login-head h2 {
            font-size: 28px;
            color: #f8fbff;
            margin-bottom: 8px;
        }

        .login-head p {
            color: #94a3b8;
            font-size: 14px;
        }

        .mode-switch {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            padding: 6px;
            border-radius: 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.12);
        }

        .mode-btn {
            flex: 1;
            border: none;
            border-radius: 12px;
            padding: 11px 14px;
            background: transparent;
            color: #94a3b8;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, rgba(34, 211, 238, 0.22), rgba(168, 85, 247, 0.22));
            color: #f8fbff;
            box-shadow: inset 0 0 0 1px rgba(125, 211, 252, 0.14);
        }

        .form-panel {
            display: none;
        }

        .form-panel.active {
            display: block;
        }

        .alert {
            display: none;
            margin-bottom: 18px;
            padding: 12px 14px;
            border-radius: 14px;
            font-size: 14px;
        }

        .alert.show {
            display: block;
        }

        .alert-error {
            background: rgba(127, 29, 29, 0.36);
            color: #fecaca;
            border: 1px solid rgba(248, 113, 113, 0.28);
        }

        .alert-success {
            background: rgba(6, 78, 59, 0.36);
            color: #bbf7d0;
            border: 1px solid rgba(52, 211, 153, 0.28);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 500;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 14px;
            background: rgba(15, 23, 42, 0.88);
            color: #f8fbff;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .pw-wrap{position:relative}
        .eye-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:#94a3b8;cursor:pointer;padding:6px;border-radius:6px}
        .eye-btn:focus{outline:2px solid rgba(34,211,238,0.14)}

        input::placeholder {
            color: #64748b;
        }

        input:focus {
            outline: none;
            border-color: rgba(34, 211, 238, 0.9);
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.14);
        }

        .button-group {
            margin-top: 28px;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #22d3ee 0%, #a855f7 100%);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(34, 211, 238, 0.18);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .button-spinner {
            display: none;
            width: 16px;
            height: 16px;
            margin-right: 8px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .login-btn:disabled .button-spinner {
            display: inline-block;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
        }

        .footer a {
            color: #7dd3fc;
            text-decoration: none;
            font-weight: 600;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .helper-text {
            margin-top: 10px;
            font-size: 12px;
            color: #94a3b8;
            line-height: 1.6;
        }

        @media (max-width: 920px) {
            .shell {
                grid-template-columns: 1fr;
            }
            .hero {
                border-right: 0;
                border-bottom: 1px solid rgba(148, 163, 184, 0.12);
            }
            .hero h1 {
                font-size: 34px;
            }
        }

        @media (max-width: 640px) {
            body {
                padding: 12px;
            }
            .hero, .login {
                padding: 28px 22px;
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        <section class="hero">
            <div>
                <div class="brand">jettyCat live studio</div>
                <h1>直播、聊天室、音视频协作的一体化入口</h1>
                <p>面向实时互动场景的工作台。登录后进入你的直播中枢，管理直播、消息流和连麦协作。</p>
            </div>
            <div class="signals">
                <div class="signal"><span class="signal-dot"></span><span>直播推流与房间状态看板</span></div>
                <div class="signal"><span class="signal-dot"></span><span>实时聊天室与消息流</span></div>
                <div class="signal"><span class="signal-dot"></span><span>音视频通话与协作房间</span></div>
            </div>
        </section>

        <section class="login">
            <div class="login-head">
                <h2>欢迎回来</h2>
                <p>输入账号进入你的直播控制中心</p>
            </div>

            <div id="alertBox" class="alert"></div>

            <div class="mode-switch">
                <button type="button" class="mode-btn active" id="loginModeBtn">登录</button>
                <button type="button" class="mode-btn" id="registerModeBtn">注册</button>
            </div>

            <form id="loginForm" class="form-panel active">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input id="username" name="username" type="text" placeholder="请输入用户名" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">密码</label>
                    <input id="password" name="password" type="password" placeholder="请输入密码" required autocomplete="current-password">
                </div>

                <div class="button-group">
                    <button type="submit" class="login-btn" id="loginBtn">
                        <span class="button-spinner"></span>
                        <span class="button-text">登陆</span>
                    </button>
                </div>
            </form>

            <form id="registerForm" class="form-panel">
                <div class="form-group">
                    <label for="regUsername">用户名</label>
                    <input id="regUsername" name="username" type="text" placeholder="请输入用户名" required autocomplete="username">
                </div>

                <div class="form-group pw-wrap">
                    <label for="regPassword">密码</label>
                    <input id="regPassword" name="password" type="password" placeholder="请输入密码" required autocomplete="new-password">
                    <button type="button" class="eye-btn" id="regPasswordToggle" aria-label="显示或隐藏密码">👁</button>
                </div>

                <div class="form-group pw-wrap">
                    <label for="regPasswordConfirm">确认密码</label>
                    <input id="regPasswordConfirm" name="password_confirm" type="password" placeholder="请再次输入密码" required autocomplete="new-password">
                    <button type="button" class="eye-btn" id="regPasswordConfirmToggle" aria-label="显示或隐藏确认密码">👁</button>
                </div>

                <div class="form-group">
                    <label for="regCode">注册验证码</label>
                    <input id="regCode" name="reg_code" type="text" placeholder="请输入管理员提供的验证码" required autocomplete="one-time-code">
                    <div class="helper-text">注册验证码由管理员通过后台生成后提供给你。</div>
                </div>

                <div class="button-group">
                    <button type="submit" class="login-btn" id="registerBtn">
                        <span class="button-spinner"></span>
                        <span class="button-text">注册并进入</span>
                    </button>
                </div>
            </form>

            <div class="footer">
                还没有账户？<a href="/pages/register.html">立即注册</a>
            </div>
        </section>
    </div>

    <script>
        const API_URL = '/api/login/jwt';
        const REGISTER_URL = '/api/registe/registe';
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const loginBtn = document.getElementById('loginBtn');
        const registerBtn = document.getElementById('registerBtn');
        const alertBox = document.getElementById('alertBox');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const regUsernameInput = document.getElementById('regUsername');
        const regPasswordInput = document.getElementById('regPassword');
        const regPasswordConfirmInput = document.getElementById('regPasswordConfirm');
        const regCodeInput = document.getElementById('regCode');
        const regPasswordToggle = document.getElementById('regPasswordToggle');
        const regPasswordConfirmToggle = document.getElementById('regPasswordConfirmToggle');
        const loginModeBtn = document.getElementById('loginModeBtn');
        const registerModeBtn = document.getElementById('registerModeBtn');

        function showAlert(message, type = 'error') {
            alertBox.textContent = message;
            alertBox.className = `alert show alert-${type}`;
            if (type === 'error') {
                setTimeout(() => alertBox.classList.remove('show'), 5000);
            }
        }

        function hideAlert() {
            alertBox.classList.remove('show');
        }

        function setButtonLoading(loading) {
            loginBtn.disabled = loading;
            loginBtn.querySelector('.button-text').textContent = loading ? '登陆中...' : '进入工作台';
        }

        function setRegisterButtonLoading(loading) {
            registerBtn.disabled = loading;
            registerBtn.querySelector('.button-text').textContent = loading ? '注册中...' : '注册并进入';
        }

        function setMode(mode) {
            const loginActive = mode === 'login';
            loginForm.classList.toggle('active', loginActive);
            registerForm.classList.toggle('active', !loginActive);
            loginModeBtn.classList.toggle('active', loginActive);
            registerModeBtn.classList.toggle('active', !loginActive);
            hideAlert();

            if (loginActive) {
                usernameInput.focus();
            } else {
                regUsernameInput.focus();
            }
        }

        // toggle password visibility helpers
        function toggleVisibility(inputEl) {
            if (!inputEl) return;
            inputEl.type = inputEl.type === 'password' ? 'text' : 'password';
        }

        function validateInput() {
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            if (!username) {
                showAlert('请输入用户名');
                usernameInput.focus();
                return false;
            }
            if (!password) {
                showAlert('请输入密码');
                passwordInput.focus();
                return false;
            }
            if (username.length < 3) {
                showAlert('用户名至少3个字符');
                return false;
            }
            if (password.length < 6) {
                showAlert('密码至少6个字符');
                return false;
            }
            return true;
        }

        function validateRegisterInput() {
            const username = regUsernameInput.value.trim();
            const password = regPasswordInput.value.trim();
            const passwordConfirm = regPasswordConfirmInput.value.trim();
            const regCode = regCodeInput.value.trim();

            if (!username) {
                showAlert('请输入用户名');
                regUsernameInput.focus();
                return false;
            }
            if (!password) {
                showAlert('请输入密码');
                regPasswordInput.focus();
                return false;
            }
            if (!regCode) {
                showAlert('请输入注册验证码');
                regCodeInput.focus();
                return false;
            }
            if (username.length < 3) {
                showAlert('用户名至少3个字符');
                return false;
            }
            if (password.length < 6) {
                showAlert('密码至少6个字符');
                return false;
            }

            if (password !== passwordConfirm) {
                showAlert('两次输入的密码不一致');
                regPasswordConfirmInput.focus();
                return false;
            }

            return true;
        }

        async function handleLogin(e) {
            e.preventDefault();
            if (!validateInput()) return;

            setButtonLoading(true);
            hideAlert();

            try {
                const params = new URLSearchParams({
                    username: usernameInput.value.trim(),
                    password: passwordInput.value.trim()
                });

                const response = await fetch(`${API_URL}?${params.toString()}`, { method: 'GET' });
                const responseText = await response.text();

                let data;
                try {
                    data = JSON.parse(responseText);
                } catch {
                    showAlert('服务器响应格式错误，请稍后重试');
                    return;
                }

                if (data.status === 'success') {
                    showAlert('登陆成功，正在跳转...', 'success');
                    setTimeout(() => {
                        window.location.href = '/pages/main.html';
                    }, 1200);
                } else if (data.status === 'failed') {
                    showAlert(data.error || '登陆失败，请检查用户名和密码');
                    passwordInput.value = '';
                    passwordInput.focus();
                } else if (data.status === 'error') {
                    showAlert(data.error || '服务器错误，请稍后重试');
                } else {
                    showAlert('未知错误，请稍后重试');
                }
            } catch (error) {
                console.error('Login error:', error);
                showAlert('网络连接失败，请检查服务器是否运行');
            } finally {
                setButtonLoading(false);
            }
        }

        async function handleRegister(e) {
            e.preventDefault();

            if (!validateRegisterInput()) return;

            setRegisterButtonLoading(true);
            hideAlert();

            try {
                const params = new URLSearchParams({
                    username: regUsernameInput.value.trim(),
                    password: regPasswordInput.value.trim(),
                    reg_code: regCodeInput.value.trim()
                });

                const response = await fetch(`${REGISTER_URL}?${params.toString()}`, { method: 'GET' });
                const responseText = await response.text();

                let data;
                try {
                    data = JSON.parse(responseText);
                } catch {
                    showAlert('服务器响应格式错误，请稍后重试');
                    return;
                }

                if (data.status === 'success') {
                    showAlert('注册成功，正在跳转...', 'success');
                    setTimeout(() => {
                        window.location.href = '/pages/main.html';
                    }, 1200);
                    return;
                }

                if (data.status === 'failed') {
                    showAlert(data.error || '注册失败，请检查输入内容');
                    regCodeInput.focus();
                    return;
                }

                if (data.status === 'error') {
                    showAlert(data.error || '服务器错误，请稍后重试');
                    return;
                }

                showAlert('未知错误，请稍后重试');
            } catch (error) {
                console.error('Register error:', error);
                showAlert('网络连接失败，请检查服务器是否运行');
            } finally {
                setRegisterButtonLoading(false);
            }
        }

        loginForm.addEventListener('submit', handleLogin);
        registerForm.addEventListener('submit', handleRegister);
        usernameInput.addEventListener('input', hideAlert);
        passwordInput.addEventListener('input', hideAlert);
        regUsernameInput.addEventListener('input', hideAlert);
        regPasswordInput.addEventListener('input', hideAlert);
        regPasswordConfirmInput.addEventListener('input', hideAlert);
        regCodeInput.addEventListener('input', hideAlert);
        loginModeBtn.addEventListener('click', () => setMode('login'));
        registerModeBtn.addEventListener('click', () => setMode('register'));
        // eye toggles
        if (regPasswordToggle) regPasswordToggle.addEventListener('click', () => toggleVisibility(regPasswordInput));
        if (regPasswordConfirmToggle) regPasswordConfirmToggle.addEventListener('click', () => toggleVisibility(regPasswordConfirmInput));
        // also add a small toggle for the login password (inline create)
        (function attachLoginEye(){
            const wrap = document.createElement('div');
            wrap.className = 'pw-wrap';
            const eye = document.createElement('button');
            eye.type = 'button';
            eye.className = 'eye-btn';
            eye.textContent = '👁';
            eye.setAttribute('aria-label','显示或隐藏密码');
            const pwd = passwordInput;
            pwd.parentNode.replaceChild(wrap, pwd);
            wrap.appendChild(pwd);
            wrap.appendChild(eye);
            eye.addEventListener('click', () => toggleVisibility(pwd));
        })();

        window.addEventListener('load', () => usernameInput.focus());
    </script>
</body>
</html>
