<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 | jettyCat</title>
  <link rel="stylesheet" href="/sources/theme.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-intro">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">✦</span><span>jettyCat</span></a>
      <div><p class="eyebrow">Live interaction studio</p><h1>清晰、实时地连接每一次互动。</h1></div>
      <p class="intro-note">实时互动工作台</p>
    </section>
    <section class="auth-card">
      <p class="eyebrow">Welcome back</p><h2>进入工作台</h2>
      <div id="alertBox" class="alert" role="alert"></div>
      <div class="mode-switch"><button id="loginModeBtn" class="mode-btn active" type="button">登录</button><button id="registerModeBtn" class="mode-btn" type="button">注册</button></div>
      <form id="loginForm" class="form-panel active">
        <div class="field"><label for="username">用户名</label><input id="username" type="text" required autocomplete="username" placeholder="请输入用户名"></div>
        <div class="field"><label for="password">密码</label><div class="password-wrap"><input id="password" type="password" required autocomplete="current-password" placeholder="请输入密码"><button id="loginPasswordToggle" class="eye-button" type="button">显示</button></div></div>
        <button id="loginBtn" class="button form-submit" type="submit">登录</button>
      </form>
      <form id="registerForm" class="form-panel">
        <div class="field"><label for="regUsername">用户名</label><input id="regUsername" type="text" required autocomplete="username" placeholder="请输入用户名"></div>
        <div class="field"><label for="regPassword">密码</label><div class="password-wrap"><input id="regPassword" type="password" required autocomplete="new-password" placeholder="至少 6 个字符"><button id="regPasswordToggle" class="eye-button" type="button">显示</button></div></div>
        <div class="field"><label for="regPasswordConfirm">确认密码</label><div class="password-wrap"><input id="regPasswordConfirm" type="password" required autocomplete="new-password" placeholder="再次输入密码"><button id="regPasswordConfirmToggle" class="eye-button" type="button">显示</button></div></div>
        <div class="field"><label for="regCode">注册验证码</label><input id="regCode" type="text" required autocomplete="one-time-code" placeholder="请输入管理员提供的验证码"><div class="helper">注册码由管理员在后台生成。</div></div>
        <button id="registerBtn" class="button form-submit" type="submit">注册并进入</button>
      </form>
      <div class="auth-footer">使用管理员账号？<a href="/admin/">进入管理后台</a></div>
    </section>
  </main>
  <script src="/sources/auth.js"></script>
</body>
</html>
