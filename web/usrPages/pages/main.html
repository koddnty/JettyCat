<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>控制台 | jettyCat</title><link rel="stylesheet" href="/sources/theme.css"></head>
<body class="dashboard">
  <header class="site-header"><a class="brand" href="/pages/main.html"><span class="brand-mark" aria-hidden="true">✦</span><span>jettyCat</span></a><button id="logoutBtn" class="button secondary" type="button">退出登录</button></header>
  <main class="dashboard-main">
    <section class="hero"><div><p class="eyebrow">Realtime control center</p><h1>欢迎回来，开始今天的互动。</h1><p>直播、聊天、连麦和数据，都从这里开始。</p></div><span class="status">服务运行正常</span></section>
    <section class="feature-grid" aria-label="功能入口">
      <article class="feature-card"><div class="feature-icon">▣</div><h3>直播控制</h3><p>查看开播状态、推流信息和房间基础配置。</p><div class="card-meta"><span>Live room</span><span>准备就绪</span></div></article>
      <article class="feature-card"><div class="feature-icon">•••</div><h3>聊天室</h3><p>承载实时文本互动、系统通知和消息协同。</p><div class="card-meta"><span>Chat stream</span><span>在线</span></div></article>
      <article class="feature-card"><div class="feature-icon">◉</div><h3>音视频通话</h3><p>进入连麦或视频协作区域，保持实时连接。</p><div class="card-meta"><span>A/V room</span><span>待机</span></div></article>
      <article class="feature-card"><div class="feature-icon">↗</div><h3>互动看板</h3><p>查看在线人数、消息流量和房间运行状态。</p><div class="card-meta"><span>Metrics</span><span>实时</span></div></article>
    </section>
  </main>
  <script>document.getElementById('logoutBtn').addEventListener('click', () => { window.location.href = '/pages/login.html'; });</script>
</body>
</html>
