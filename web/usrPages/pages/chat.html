<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>聊天室 | jettyCat</title>
  <link rel="stylesheet" href="/sources/theme.css">
  <link rel="stylesheet" href="/sources/chat.css">
</head>
<body class="chat-page">
  <header class="site-header chat-header">
    <a class="brand" href="/pages/main.html"><span class="brand-mark" aria-hidden="true">✦</span><span>jettyCat</span></a>
    <div class="chat-header-right">
      <span id="connBadge" class="conn-badge offline">连接中…</span>
      <button id="logoutBtn" class="button secondary" type="button">退出登录</button>
    </div>
  </header>

  <main class="chat-shell">
    <aside class="conv-sidebar">
      <div class="conv-top">
        <h2>消息</h2>
        <button id="newConvBtn" class="button new-conv" type="button">＋ 新建会话</button>
      </div>
      <div id="convList" class="conv-list" aria-label="会话列表"></div>
    </aside>

    <section class="chat-panel">
      <header id="peerBar" class="peer-bar">
        <div class="peer">
          <span id="peerAvatar" class="peer-avatar">?</span>
          <div class="peer-meta">
            <h2 id="peerTitle">选择一个会话</h2>
            <p id="peerSub" class="peer-sub">从左侧选择或新建一个会话</p>
          </div>
        </div>
      </header>

      <div id="msgList" class="msg-list" aria-live="polite">
        <div class="msg-empty">开始一段对话吧</div>
      </div>

      <footer class="input-bar">
        <textarea id="inputBox" rows="1" placeholder="输入消息，Enter 发送，Shift + Enter 换行" disabled></textarea>
        <button id="sendBtn" class="button" type="button" disabled>发送</button>
      </footer>
    </section>
  </main>

  <div id="newConvModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-label="新建会话">
    <div class="modal">
      <h3>新建会话</h3>
      <div class="modal-tabs">
        <button id="tabUser" class="modal-tab active" type="button">私聊</button>
        <button id="tabGroup" class="modal-tab" type="button">群聊</button>
      </div>
      <div class="field">
        <label id="idFieldLabel" for="peerIdInput">对方用户 ID</label>
        <input id="peerIdInput" type="number" min="1" step="1" placeholder="请输入对方用户 ID">
        <div class="helper" id="idFieldHint">私聊消息通过 WebSocket 实时收发，可加载历史记录。</div>
      </div>
      <div class="modal-actions">
        <button id="cancelConvBtn" class="button secondary" type="button">取消</button>
        <button id="confirmConvBtn" class="button" type="button">开始聊天</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="/sources/chat.js"></script>
</body>
</html>
