<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JettyCat · MinIO STS 直传验证</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #222; background: #fafafa; }
    h1 { font-size: 20px; }
    section { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    h2 { font-size: 15px; margin-top: 0; }
    label { display: block; margin: 8px 0 4px; font-size: 13px; color: #555; }
    input[type=text], input[type=password], input[type=file] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { margin-top: 12px; padding: 8px 16px; border: 0; border-radius: 4px; background: #2563eb; color: #fff; cursor: pointer; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    pre { background: #f4f4f4; border: 1px solid #eee; border-radius: 4px; padding: 10px; font-size: 12px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
    .ok { color: #16a34a; } .err { color: #dc2626; }
    .row { display: flex; gap: 8px; align-items: center; }
  </style>
</head>
<body>
  <h1>MinIO STS 直传验证</h1>

  <section>
    <h2>1. 登录获取 JWT</h2>
    <label>账号</label>
    <input type="text" id="username" value="koddnty" placeholder="user_id">
    <label>密码</label>
    <input type="password" id="password" placeholder="password">
    <button id="btnLogin">登录</button>
    <pre id="loginResp">—</pre>
  </section>

  <section>
    <h2>2. 申请 STS 临时凭证</h2>
    <button id="btnSts">获取 STS 凭证</button>
    <pre id="stsResp">—</pre>
  </section>

  <section>
    <h2>3. 选择文件直传 MinIO</h2>
    <input type="file" id="file">
    <button id="btnUpload" disabled>上传</button>
    <pre id="uploadResp">—</pre>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/aws-sdk@2.1691.0/dist/aws-sdk.min.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    let sts = null;

    async function postJson(url, body) {
      const r = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: body ? JSON.stringify(body) : undefined
      });
      return r.json();
    }

    $('btnLogin').onclick = async () => {
      $('loginResp').textContent = '请求中...';
      try {
        const j = await postJson('/api/login/jwt', {
          username: $('username').value,
          password: $('password').value
        });
        $('loginResp').textContent = JSON.stringify(j, null, 2);
        $('loginResp').className = j.status === 'success' ? 'ok' : 'err';
      } catch (e) {
        $('loginResp').textContent = 'Error: ' + e;
        $('loginResp').className = 'err';
      }
    };

    $('btnSts').onclick = async () => {
      $('stsResp').textContent = '请求中...';
      try {
        const j = await postJson('/api/upload/sts', null);
        $('stsResp').textContent = JSON.stringify(j, null, 2);
        if (j.status === 'success') {
          sts = j.data;
          $('btnUpload').disabled = false;
        } else {
          $('stsResp').className = 'err';
          $('btnUpload').disabled = true;
        }
      } catch (e) {
        $('stsResp').textContent = 'Error: ' + e;
        $('stsResp').className = 'err';
      }
    };

    $('btnUpload').onclick = () => {
      const file = $('file').files[0];
      if (!file) { $('uploadResp').textContent = '请先选择文件'; return; }
      if (!sts) { $('uploadResp').textContent = '请先获取 STS 凭证'; return; }
      $('uploadResp').textContent = '上传中...';

      const s3 = new AWS.S3({
        endpoint: 'http://' + sts.endpoint,
        accessKeyId: sts.accessKeyId,
        secretAccessKey: sts.secretAccessKey,
        sessionToken: sts.sessionToken,
        s3ForcePathStyle: true,
        signatureVersion: 'v4',
        region: sts.region,
        s3BucketEndpoint: false
      });

      s3.upload({
        Bucket: sts.bucket,
        Key: 'uploads/' + Date.now() + '-' + file.name,
        Body: file
      }, (err, data) => {
        if (err) {
          $('uploadResp').textContent = '上传失败: ' + err.message;
          $('uploadResp').className = 'err';
        } else {
          $('uploadResp').textContent = '上传成功: ' + data.Location;
          $('uploadResp').className = 'ok';
        }
      });
    };
  </script>
</body>
</html>
