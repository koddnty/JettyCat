<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生成注册码 | jettyCat</title><link rel="stylesheet" href="../sources/admin.css"></head>
<body><main class="panel"><p class="eyebrow">Registration access</p><h2>生成注册码</h2><p class="lead">为新用户生成一次性注册码。请求会携带当前 HttpOnly 认证 Cookie。</p>
  <div class="fields"><div class="field"><label for="timeLimit">过期时间（秒）</label><input id="timeLimit" type="number" min="60" value="3600"></div><div class="field"><label for="validTimes">有效次数</label><input id="validTimes" type="number" min="1" value="1"></div></div>
  <div class="actions"><button id="generate" class="button" type="button">生成注册码</button><button id="clear" class="button secondary" type="button">重置</button></div>
  <section id="outputArea" class="result" hidden><div><div class="result-label">当前注册码</div><div id="code" class="code">—</div></div><button id="copy" class="button secondary" type="button">复制</button></section><div id="msg" class="message" aria-live="polite">注册码有效期和次数可按需设置。</div>
</main><script>
const $ = (id) => document.getElementById(id); const output = $('outputArea');
function showResult(code, message) { $('code').textContent = code; $('msg').textContent = message; output.hidden = false; }
$('generate').addEventListener('click', async () => { const button = $('generate'); button.disabled = true; button.textContent = '生成中...'; $('msg').textContent = ''; try { const params = new URLSearchParams({'time-limit': $('timeLimit').value || '3600', 'valid-times': $('validTimes').value || '1'}); const response = await fetch('/api/registe/getRegCode?' + params, {method:'GET', credentials:'include'}); const text = await response.text(); if (!response.ok) { let error = text || '生成失败'; try { error = JSON.parse(text).error || error; } catch (_) {} showResult('—', error); } else if (text.trim() === 'timeout') showResult('—', 'Redis 请求超时'); else showResult(text.trim(), '生成成功，请将注册码提供给用户。'); } catch (_) { showResult('—', '网络错误或服务器无法访问'); } finally { button.disabled = false; button.textContent = '生成注册码'; } });
$('clear').addEventListener('click', () => { $('timeLimit').value = 3600; $('validTimes').value = 1; output.hidden = true; $('msg').textContent = '注册码有效期和次数可按需设置。'; });
$('copy').addEventListener('click', async () => { try { await navigator.clipboard.writeText($('code').textContent); $('msg').textContent = '已复制到剪贴板'; } catch (_) { $('msg').textContent = '复制失败，请手动复制'; } });
</script></body></html>
