<body><div class="admin-shell">

</div><script>
const frame = document.getElementById('content-frame');
const items = document.querySelectorAll('.menu-item');
function load(item) { items.forEach((node) => node.classList.toggle('active', node === item)); frame.src = item.dataset.url; }
items.forEach((item) => item.addEventListener('click', () => load(item)));
load(items[0]);
</script></body>
