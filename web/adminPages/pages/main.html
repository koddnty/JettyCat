
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>后台管理系统</title>
  <style>
    :root {
      --bg: #0f1720;
      --card: #0b1220;
      --accent: #06b6d4;
      --muted: #9ca3af;
      --text: #e6eef6;
      --sidebar-width: 240px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      overflow: hidden;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: rgba(156,163,175,0.3); border-radius: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }

    .sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      background: var(--card);
      border-right: 1px solid rgba(255,255,255,0.03);
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .sidebar-header {
      padding: 24px 20px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 1px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      color: var(--text);
    }

    .sidebar-menu {
      flex: 1;
      padding: 16px 12px;
      overflow-y: auto;
    }

    .menu-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      margin-bottom: 6px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--muted);
      font-size: 14px;
      transition: all 0.2s ease;
      user-select: none;
    }

    .menu-item:hover {
      background: rgba(255,255,255,0.05);
      color: var(--text);
    }

    .menu-item.active {
      background: rgba(6, 182, 212, 0.12);
      color: var(--accent);
      font-weight: 500;
    }

    .menu-item svg {
      width: 18px;
      height: 18px;
      margin-right: 12px;
      stroke: currentColor;
      fill: none;
      flex-shrink: 0;
    }

    .main-content {
      flex: 1;
      min-width: 0;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* iframe 铺满右侧区域，无边框无滚动条 */
    #content-frame {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-header">JettyCat 管理</div>
  <div class="sidebar-menu">
    <div class="menu-item active" data-url="admin_registeCode.html">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 013 3m3 0a6 6 0 01-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1121.75 8.25z" />
      </svg>
      <span>注册码生成</span>
    </div>

    <div class="menu-item" data-url="user_manager.html">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 9m0-3a3 3 0 11-6 0 3 3 0 016 0zM3 19a8 8 0 1116 0H3z"/>
      </svg>
      <span>用户管理</span>
    </div>
  </div>
</aside>

<main class="main-content">
  <iframe id="content-frame" src="" title="子页面内容"></iframe>
</main>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const frame = document.getElementById('content-frame');
  const menuItems = document.querySelectorAll('.menu-item');
  const activeItem = document.querySelector('.menu-item.active');

  function loadPage(url) {
    frame.src = url;
  }

  if (activeItem) {
    loadPage(activeItem.dataset.url);
  }

  menuItems.forEach(item => {
    item.addEventListener('click', () => {
      menuItems.forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      loadPage(item.dataset.url);
    });
  });
});
</script>
</body>
</html>
